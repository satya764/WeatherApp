name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project WeatherApp.xcodeproj \
            -scheme WeatherApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:WeatherAppTests \
            CODE_SIGNING_ALLOWED=NO

      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project WeatherApp.xcodeproj \
            -scheme WeatherApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:WeatherAppUITests \
            CODE_SIGNING_ALLOWED=NO
