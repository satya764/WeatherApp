name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      # Runner images change which simulators they ship, so don't hardcode a device name.
      - name: Pick a simulator
        id: sim
        run: |
          pick() {
            xcrun simctl list devices available | grep "iPhone" | head -1 \
              | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}'
          }
          UDID=$(pick || true)
          if [ -z "$UDID" ]; then
            xcodebuild -downloadPlatform iOS
            UDID=$(pick)
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project WeatherApp.xcodeproj \
            -scheme WeatherApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:WeatherAppTests \
            CODE_SIGNING_ALLOWED=NO

      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project WeatherApp.xcodeproj \
            -scheme WeatherApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:WeatherAppUITests \
            CODE_SIGNING_ALLOWED=NO
